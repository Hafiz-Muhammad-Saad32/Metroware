# spring.application.name=metroware

spring.config.import=optional:file:.env[.properties]

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/metroware}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Tables schema.sql banata hai, Hibernate nahi
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}

server.port=8080
# andar ki error details user ko na dikhao
server.error.include-message=never

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- Default admin (pehli baar startup par ban jata hai) ----
app.seed.admin-name=Admin
app.seed.admin-email=admin@test.com
app.seed.admin-password=${ADMIN_PASSWORD}

# ---- CORS / HTTPS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
app.require-https=${REQUIRE_HTTPS:false}
server.forward-headers-strategy=${FORWARD_HEADERS:none}